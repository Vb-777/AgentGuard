[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.1.0"
description = "A policy-enforcement gateway between AI agents and their tools: scoped access, signed approvals, provenance checks and a tamper-evident audit log."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vaibhav Barsaiyan" }]
keywords = ["ai-security", "llm", "agents", "prompt-injection", "access-control", "audit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentguard = "agentguard.cli:main"

[tool.setuptools.packages.find]
include = ["agentguard*"]

[tool.setuptools.package-data]
"agentguard.demo" = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
